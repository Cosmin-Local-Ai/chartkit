[workspace]
resolver = "2"
members = ["crates/core", "crates/store", "crates/ingest", "crates/server", "desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
chartkit-core = { path = "crates/core" }
chartkit-store = { path = "crates/store" }
chartkit-ingest = { path = "crates/ingest" }
chartkit-server = { path = "crates/server" }

tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
axum = { version = "0.8.9", features = ["ws", "json"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
futures-util = "0.3.34"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.10", features = ["derive"] }
# Desktop shell only. `custom-protocol` is not enabled: the debug binary is meant to
# be run directly (plain local server + browser), which needs the bundled assets
# without `tauri dev`'s dev-protocol handshake.
tauri = { version = "2.12.7" }
tauri-build = { version = "2.7.6" }

[profile.release]
opt-level = 3
lto = "thin"
