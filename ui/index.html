<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChartKit — local chart workspace</title>
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar" id="topbar"></header>
      <aside class="sidebar" id="sidebar"></aside>
      <main class="chart-area"><div class="pane-stack" id="pane-stack" tabindex="0"></div></main>
      <aside class="ladder-panel" id="ladder-panel"></aside>
      <footer class="status" id="status"></footer>
    </div>
    <div class="dialog-backdrop" id="dialog-backdrop" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
